name: Finalize BCHEIKH business card

on:
  push:
    paths:
      - '.github/workflows/sync-bcheikh-card.yml'

permissions:
  contents: write

jobs:
  finalize-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure official card and wire the storefront
        run: |
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/BEAUVILLE/digiy-market/main/assets/partners/bcheikh-card.webp' \
            -o carte-visite.webp
          test -s carte-visite.webp
          sed -i 's/carte-visite\.png/carte-visite.webp/g' index.html
          rm -f carte-visite.png
          git rm -f .github/workflows/sync-bcheikh-card.yml

      - name: Commit final BCHEIKH card wiring
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html carte-visite.webp
          git add -u
          if git diff --cached --quiet; then
            echo 'BCHEIKH card already finalized'
          else
            git commit -m 'Wire official BCHEIKH business card'
            git push
          fi
