name: Install BCHEIKH HD business card

on:
  push:
    paths:
      - '.tmp/bcheikh-card/ready'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify HD card
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/bcheikh-card/part*.b64 | base64 -d > carte-visite.webp
          test "$(stat -c%s carte-visite.webp)" -gt 90000
          echo "c6615a39399f29b2d13f439e3677f3d9f00e7871a321267459b480562c580eaf  carte-visite.webp" | sha256sum -c -

      - name: Enlarge and enable card sharing
        run: python3 .github/scripts/install_bcheikh_card.py

      - name: Verify final page
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="shareCardButton"' index.html
          grep -q 'width:min(100%,560px)' index.html
          grep -q 'width:min(100%,520px)' index.html
          grep -q 'navigator.canShare' index.html
          grep -q 'carte-visite.webp' index.html

      - name: Commit final BCHEIKH card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add index.html carte-visite.webp
          git rm -f carte-visite-bcheikh-prix.png
          git rm -r .tmp/bcheikh-card
          git rm .github/workflows/install-bcheikh-card-hd.yml .github/scripts/install_bcheikh_card.py
          git commit -m "Install shareable HD BCHEIKH business card"
          git pull --rebase origin main
          git push origin HEAD:main
