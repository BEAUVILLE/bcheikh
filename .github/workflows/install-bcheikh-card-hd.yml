name: Install BCHEIKH HD business card

on:
  push:
    paths:
      - '.tmp/bcheikh-card/ready'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build HD card
        shell: bash
        run: |
          cat .tmp/bcheikh-card/part*.b64 | base64 -d > carte-visite.webp
          BYTES=$(stat -c%s carte-visite.webp)
          echo "BCHEIKH card size: ${BYTES} bytes"
          test "$BYTES" -gt 150000

      - name: Enlarge card and add direct sharing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')

          h=h.replace(
            '.business-card{\n      display:grid;\n      grid-template-columns:.92fr 1.08fr;\n      gap:24px;',
            '.business-card{\n      display:grid;\n      grid-template-columns:1.12fr .88fr;\n      gap:28px;'
          )
          h=h.replace(
            '.business-card img{width:min(100%,360px);margin:auto;border-radius:26px;border:1px solid var(--line);background:#0a0a0a}',
            '.card-visual{display:flex;justify-content:center;align-items:center}.business-card img{width:min(100%,560px);margin:auto;border-radius:26px;border:1px solid var(--line);background:#0a0a0a;box-shadow:0 22px 64px rgba(0,0,0,.42)}'
          )
          h=h.replace(
            '.hero,.business-card{grid-template-columns:1fr}\n      .hero{padding-top:38px}',
            '.hero,.business-card{grid-template-columns:1fr}\n      .business-card img{width:min(100%,520px)}\n      .hero{padding-top:38px}'
          )

          old='''<a class="btn btn-primary" data-i18n="openCard" href="carte-visite.webp" rel="noopener" target="_blank">Ouvrir la carte</a>\n<a class="btn btn-secondary" data-i18n="download" download="" href="carte-visite.webp">Télécharger</a>'''
          new='''<a class="btn btn-primary" data-i18n="openCard" href="carte-visite.webp" rel="noopener" target="_blank">Ouvrir la carte</a>\n<button class="btn btn-secondary" id="shareCardButton" type="button">Partager la carte</button>\n<a class="btn btn-secondary" data-i18n="download" download="BCHEIKH-carte-visite.webp" href="carte-visite.webp">Télécharger</a>'''
          if old not in h:
              raise SystemExit('Card action block not found')
          h=h.replace(old,new,1)

          marker='''    shareShopButton.addEventListener("click",async()=>{'''
          share_js=r'''
    const shareCardButton=document.getElementById("shareCardButton");
    const cardShareLabels={fr:"Partager la carte",en:"Share the card",es:"Compartir la tarjeta",pt:"Partilhar o cartão",it:"Condividi la scheda",de:"Visitenkarte teilen",nl:"Deel het kaartje",ar:"مشاركة البطاقة"};
    const cardShareStatus={fr:"Carte prête à être partagée.",en:"Card ready to share.",es:"Tarjeta lista para compartir.",pt:"Cartão pronto para partilhar.",it:"Scheda pronta da condividere.",de:"Visitenkarte bereit zum Teilen.",nl:"Kaart klaar om te delen.",ar:"البطاقة جاهزة للمشاركة."};
    function currentCardLang(){
      const v=(document.getElementById("languageSelect")?.value||document.documentElement.lang||"fr").slice(0,2).toLowerCase();
      return cardShareLabels[v]?v:"fr";
    }
    function syncShareCardLabel(){if(shareCardButton)shareCardButton.textContent=cardShareLabels[currentCardLang()];}
    syncShareCardLabel();
    document.getElementById("languageSelect")?.addEventListener("change",()=>setTimeout(syncShareCardLabel,0));
    shareCardButton?.addEventListener("click",async()=>{
      const lang=currentCardLang();
      const cardUrl=new URL("carte-visite.webp",location.href).href;
      try{
        const response=await fetch(cardUrl,{cache:"no-store"});
        if(!response.ok)throw new Error("card-fetch");
        const blob=await response.blob();
        const file=new File([blob],"BCHEIKH-carte-visite.webp",{type:blob.type||"image/webp"});
        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"BCHEIKH",text:translations[lang]?.shareText||translations.fr.shareText});
        }else if(navigator.share){
          await navigator.share({title:"BCHEIKH",text:translations[lang]?.shareText||translations.fr.shareText,url:cardUrl});
        }else{
          await navigator.clipboard.writeText(cardUrl);
        }
        shareStatus.textContent=cardShareStatus[lang];
      }catch(err){
        if(err && err.name==="AbortError")return;
        try{await navigator.clipboard.writeText(cardUrl);shareStatus.textContent=cardShareStatus[lang];}
        catch(_){location.href=cardUrl;}
      }
    });

'''
          if marker not in h:
              raise SystemExit('Share shop marker not found')
          h=h.replace(marker,share_js+marker,1)

          p.write_text(h,encoding='utf-8')
          PY

      - name: Verify wiring
        shell: bash
        run: |
          grep -q 'id="shareCardButton"' index.html
          grep -q 'width:min(100%,560px)' index.html
          grep -q 'carte-visite.webp' index.html
          test $(stat -c%s carte-visite.webp) -gt 150000

      - name: Commit final BCHEIKH card
        shell: bash
        run: |
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add index.html carte-visite.webp
          git rm -r .tmp/bcheikh-card .github/workflows/install-bcheikh-card-hd.yml
          git commit -m "Install shareable HD BCHEIKH business card"
          git push
