name: Cartes BCHEIKH adhérent DIGIYLYFE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctrine-adherent-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Pillow
        run: python3 -m pip install --quiet pillow
      - name: Poser uniquement ADHÉRENT DIGIYLYFE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          names=[
            'BCHEIKH_CARTE_PRO_9x16_1080x1920 (1).png',
            'carte-visite-bcheikh-prix.png',
            'carte-visite.png',
            'carte-visite.webp'
          ]
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for name in names:
              p=Path(name)
              if not p.exists():
                  continue
              im=Image.open(p).convert('RGB')
              w,h=im.size
              d=ImageDraw.Draw(im)
              # Petit badge neutre entre le titre et la zone produit : aucune certification.
              bw=int(w*0.50); bh=max(42,int(h*0.035))
              x1=(w-bw)//2; x2=x1+bw
              y1=int(h*0.245); y2=y1+bh
              d.rounded_rectangle((x1,y1,x2,y2),radius=bh//2,fill=(7,55,39),outline=(226,174,43),width=max(2,w//400))
              text='ADHÉRENT DIGIYLYFE'
              size=max(18,int(h*0.017))
              while size>14:
                  f=ImageFont.truetype(font_path,size)
                  b=d.textbbox((0,0),text,font=f)
                  if b[2]-b[0] <= bw-36:
                      break
                  size-=1
              tw=b[2]-b[0]; th=b[3]-b[1]
              d.text(((w-tw)/2,y1+(bh-th)/2-2),text,font=f,fill=(244,199,77))
              if p.suffix.lower()=='.webp':
                  im.save(p,'WEBP',quality=94,method=6)
              else:
                  im.save(p,'PNG',optimize=True)
          PY
      - name: Commit, rebase et push
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/doctrine-adherent-fix.yml
          git add 'BCHEIKH_CARTE_PRO_9x16_1080x1920 (1).png' carte-visite-bcheikh-prix.png carte-visite.png carte-visite.webp 2>/dev/null || true
          git commit -m 'Cartes BCHEIKH : adhérent DIGIYLYFE'
          git pull --rebase origin main
          git push
